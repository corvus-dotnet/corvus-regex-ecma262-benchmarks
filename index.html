<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regex engines on every platform: ECMA-262 compliance and performance</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dark run-header band, one sticky control row that drives every view, then stacked full-width sections. */
:root {
  --page: #f5f6f8;
  --surface: #ffffff;
  --ink: #0f1621;
  --ink-2: #4a5464;
  --muted: #7d8696;
  --grid: #e4e7ec;
  --axis: #c5cad3;
  --line: rgba(15, 22, 33, 0.10);
  --accent: #6250d6;
  --accent-ink: #ffffff;
  --bar: #9aa4b4;
  --faster: #1c5cab;
  --slower: #b8322f;
  --neutral: #eef0f2;
  --series-a: #2a78d6;
  --series-b: #eb6834;
  --fail-a: #e4e7ec;
  --fail-b: #f7f8fa;
  --band: #121b2b;
  --band-ink: #eef1f6;
  --band-muted: #9aa6ba;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0c1018; --surface: #141a24; --ink: #eef1f6; --ink-2: #b7bfcc; --muted: #828b9b; --grid: #232b37;
    --axis: #364051; --line: rgba(255, 255, 255, 0.10); --accent: #9085e9; --accent-ink: #0c1018; --bar: #5d6778;
    --faster: #4b93ea; --slower: #e66767; --neutral: #2a313c; --series-a: #3987e5; --series-b: #d95926;
    --fail-a: #232b37; --fail-b: #181e28; --band: #060910; --band-ink: #eef1f6; --band-muted: #8d98ab;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0c1018; --surface: #141a24; --ink: #eef1f6; --ink-2: #b7bfcc; --muted: #828b9b; --grid: #232b37;
  --axis: #364051; --line: rgba(255, 255, 255, 0.10); --accent: #9085e9; --accent-ink: #0c1018; --bar: #5d6778;
  --faster: #4b93ea; --slower: #e66767; --neutral: #2a313c; --series-a: #3987e5; --series-b: #d95926;
  --fail-a: #232b37; --fail-b: #181e28; --band: #060910; --band-ink: #eef1f6; --band-muted: #8d98ab;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0;  background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

/* Run header */
.band { background: var(--band); color: var(--band-ink); padding-block: 28px 24px; }
.band .wrap { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--band-muted); }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
.lede { margin: 0; max-width: 68ch; color: var(--band-muted); }
.runmeta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 6px; font-family: var(--font-data); font-size: 13px; color: var(--band-ink); }
.runmeta span { color: var(--band-muted); }
.runmeta a { color: var(--band-ink); }
.eyebrow a { color: inherit; }

/* Controls */
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; }
.controls .wrap { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
/* A select in a control row shrinks to the row rather than to its longest option, which at phone width runs off the page. */
.ctl select { min-width: 0; }
.ctl > label, .ctl-label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--neutral); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; max-width: 100%; }

.picker { position: static; }
.picker > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.picker > summary::-webkit-details-marker { display: none; }
.picker > summary::after { content: " ▾"; color: var(--muted); }
.picker[open] > summary { background: var(--neutral); }
.picker-panel { position: absolute; left: 0; top: calc(100% + 6px); width: min(1080px, 100%); max-height: min(70vh, 560px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); padding: 14px; display: grid; gap: 12px; }
.picker-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.picker-actions button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.picker-actions button:hover { background: var(--neutral); }
.langs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 22px; }
.lang h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.lang label { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; align-items: start; font-size: 14px; padding: 3px 0; cursor: pointer; }
.lang label input { margin: 3px 0 0; }
/* A name wraps between its words, never at the hyphens inside one; the version and the compliance sit on a line of their
   own beneath it, so neither runs into the next column. */
.pick-name .w { white-space: nowrap; }
.pick-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 1px; }
.pick-meta:empty { display: none; }
.lang label small { color: var(--muted); font-family: var(--font-data); font-size: 11px; }
.comp { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.comp-ok { color: var(--faster); border-color: currentColor; }
.comp-wrong { color: var(--slower); border-color: currentColor; }
.comp-x { border-style: dashed; }

/* Sections */
main { padding-block: 8px 48px; }
section { padding-block: 28px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; min-width: 0; }
section:last-of-type { border-bottom: 0; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
.note { margin: 0; color: var(--ink-2); max-width: 75ch; }
.note b { color: var(--ink); font-weight: 600; }
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-body); }
.tick { fill: var(--muted); font-size: 11px; font-family: var(--font-data) !important; font-variant-numeric: tabular-nums; }
.lab { fill: var(--ink); font-size: 13px; }
.lab-sub { fill: var(--muted); font-size: 11px; }
.val { fill: var(--ink-2); font-size: 12px; font-family: var(--font-data) !important; font-variant-numeric: tabular-nums; }
.row-hit { fill: transparent; cursor: default; }
.row-hit:hover, .row-hit.hl { fill: var(--neutral); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.ramp { display: inline-flex; align-items: center; gap: 8px; }
.ramp i { display: block; width: 180px; height: 10px; border-radius: 3px; }
.ramp span { font-family: var(--font-data); font-size: 11px; color: var(--muted); }

/* Matrix */
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.matrix { border-collapse: separate; border-spacing: 2px; font-family: var(--font-data); font-size: 11px; font-variant-numeric: tabular-nums; }
.matrix th { font-weight: 500; color: var(--ink-2); }
.matrix thead th { vertical-align: bottom; padding: 6px 0 4px; height: 150px; }
.matrix thead th div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-family: var(--font-body); font-size: 12px; margin: 0 auto; }
.matrix thead th.base div { color: var(--accent); font-weight: 600; }
.matrix tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 0 10px 0 8px; white-space: nowrap; font-family: var(--font-body); font-size: 13px; cursor: pointer; }
.matrix tbody th:hover { color: var(--accent); }
.matrix tbody th small { color: var(--muted); font-family: var(--font-data); font-size: 10px; margin-left: 6px; }
.matrix thead th.corner { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding-left: 8px; font-family: var(--font-body); font-size: 12px; color: var(--muted); }
.matrix td { min-width: 40px; height: 24px; text-align: center; border-radius: 3px; padding: 0 3px; cursor: default; }
.matrix td.fail { background: repeating-linear-gradient(45deg, var(--fail-a) 0 3px, var(--fail-b) 3px 6px); color: var(--muted); }
.matrix td.miss { color: var(--muted); }
.matrix td.stop { color: var(--muted); font-size: 0.85em; white-space: nowrap; }
.matrix td.wrongcount { color: var(--slower); font-weight: 600; font-size: 0.85em; white-space: nowrap; }
.matrix tr.current th { color: var(--accent); }
/* Phones: the workload column is capped (the full name is the row's title) so the cells sit beside it rather than
   off-screen, the rotated headers are shorter, and a section header's picker takes the line's width. */
@media (max-width: 640px) {
  .matrix tbody th { max-width: 8.5rem; overflow: hidden; text-overflow: ellipsis; font-size: 12px; padding: 0 6px 0 6px; }
  .matrix thead th { height: 112px; }
  .matrix thead th div { font-size: 11px; }
  .matrix td { min-width: 32px; }
  .sec-head > h2 { flex: 1 1 100%; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .sec-head select { min-width: 0; width: 100%; }
}

.pair { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pair .vs { color: var(--muted); font-size: 13px; }
.dot-a { background: var(--series-a); }
.dot-b { background: var(--series-b); }
.schema-meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-family: var(--font-data); font-size: 13px; color: var(--ink-2); }
.schema-meta b { color: var(--ink); font-weight: 500; }
.method { columns: 2 320px; column-gap: 32px; color: var(--ink-2); }
.method p { margin: 0 0 10px; break-inside: avoid; }
.method b { color: var(--ink); font-weight: 600; }
.engines-wrap { overflow-x: auto; }
table.engines { border-collapse: collapse; width: 100%; font-size: 14px; }
.engines th, .engines td { text-align: left; vertical-align: top; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
.engines thead th { color: var(--muted); font-size: 12px; font-weight: 600; }
.engines tbody th { font-weight: 500; color: var(--ink); }
.engines tr.grp th { padding-top: 16px; font-weight: 600; border-bottom: 0; }
.engines td.ver, .engines td.rows { font-family: var(--font-data); font-size: 12px; color: var(--ink-2); }
.engines td.rows span { display: block; }
.engines th .how { display: block; margin-top: 2px; max-width: 46ch; font-weight: 400; font-size: 13px; color: var(--ink-2); }
/* At phone width each engine is a block: its name, version and rows, then where to get it and its source. */
@media (max-width: 640px) {
  table.engines, .engines tbody { display: block; }
  .engines thead { display: none; }
  .engines tbody tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .engines tbody tr.grp { display: block; border-bottom: 0; padding: 12px 0 0; }
  .engines th, .engines td { border: 0; padding: 0; }
  .engines tbody tr > th, .engines td.ver, .engines td.rows { grid-column: 1 / -1; }
}

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); padding: 8px 10px; font-size: 13px; max-width: 300px; }
#tip .t-h { font-weight: 600; }
#tip .t-s { color: var(--muted); font-size: 12px; }
#tip .t-r { display: flex; justify-content: space-between; gap: 14px; font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
#tip .t-r span:first-child { color: var(--ink-2); font-family: var(--font-body); }
@media (prefers-reduced-motion: no-preference) { .seg button, .row-hit { transition: background-color 0.12s, fill 0.12s; } }
</style>

</head>
<body>
<header class="band gutter">
  <div class="wrap">
    <div class="eyebrow" id="repo"></div>
    <h1 id="title">Benchmark results</h1>
    <p class="lede" id="lede"></p>
    <div class="runmeta" id="runmeta"></div>
  </div>
</header>

<div class="controls gutter">
  <div class="wrap">
    <div class="ctl"><span class="ctl-label">Measure</span><div class="seg" id="metric" role="group" aria-label="Measure"></div></div>
    <div class="ctl"><label for="baseline">Compare with</label><select id="baseline"></select></div>
    <details class="picker ctl" id="picker">
      <summary id="picker-sum"></summary>
      <div class="picker-panel">
        <div class="picker-actions">
          <button type="button" data-pick="all">Select all</button>
          <button type="button" data-pick="none">Clear</button>
          <button type="button" data-pick="complete" id="pick-complete"></button>
        </div>
        <div class="langs" id="langs"></div>
      </div>
    </details>
  </div>
</div>

<main class="gutter">
  <div class="wrap">
    <section id="overall">
      <div class="sec-head"><h2>Overall</h2><div class="legend" id="board-legend"></div></div>
      <p class="note" id="board-note"></p>
      <div class="chart" id="board"></div>
    </section>

    <section id="by-schema">
      <div class="sec-head">
        <h2 id="by-schema-title"></h2>
        <div class="pair">
          <div class="ctl"><label for="sort">Order</label><select id="sort">
            <option value="name">Name</option><option value="spread">Spread</option>
          </select></div>
          <div class="ctl"><span class="ctl-label">Cells</span><div class="seg" id="cells" role="group" aria-label="Cell text">
            <button type="button" data-cell="ratio" aria-pressed="true">Ratio</button><button type="button" data-cell="value" aria-pressed="false">Median</button>
          </div></div>
        </div>
      </div>
      <div class="legend" id="matrix-legend"></div>
      <div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>
    </section>

    <section id="schema">
      <div class="sec-head">
        <h2><span id="schema-title"></span> <select id="schema-pick"></select></h2>
        <div class="ctl"><span class="ctl-label">Scale</span><div class="seg" id="scale" role="group" aria-label="Scale">
          <button type="button" data-scale="log" aria-pressed="true">Log</button><button type="button" data-scale="linear" aria-pressed="false">Linear</button>
        </div></div>
      </div>
      <div class="schema-meta" id="schema-meta"></div>
      <div class="legend" id="schema-legend"></div>
      <div class="chart" id="schema-chart"></div>
    </section>

    <section id="head-to-head">
      <div class="sec-head">
        <h2>Head to head</h2>
        <div class="pair">
          <span class="sw dot-a"></span><select id="h2h-a"></select>
          <span class="vs">vs</span>
          <span class="sw dot-b"></span><select id="h2h-b"></select>
        </div>
      </div>
      <p class="note" id="h2h-note"></p>
      <div class="chart" id="h2h-chart"></div>
    </section>

    <section id="method">
      <h2>How to read this</h2>
      <div class="method" id="method-text"></div>
    </section>

    <section id="engines" hidden>
      <h2 id="engines-title"></h2>
      <p class="note" id="engines-note"></p>
      <div class="engines-wrap"><table class="engines" id="engines-table"></table></div>
    </section>
  </div>
</main>

<div id="tip" role="tooltip" hidden></div>

const DATA = {"meta":{"title":"Regex engines on every platform: ECMA-262 compliance and performance","lede":"How closely the regular expression engines of each platform follow ECMA-262, and how fast they are. Engines that implement ECMA-262 and each platform's other regex engines appear side by side, with V8 as the common reference, judged on the ECMA-262 test data and timed over the Industry workloads of dotnet/performance. Every engine ran on this runner tonight, in one job, so a figure compares across languages as well as within one.","repo":"corvus-dotnet/corvus-regex-ecma262-benchmarks","icon":"favicon.svg","facts":[["Runner","GitHub-hosted ubuntu24 20261023.334.3, AMD EPYC 9V45 96-Core Processor, 4 cores"],["Test data","corvus-dotnet/ecma262-regex-test-data at cff0860b7e, the same for every engine"],[".NET","ghcr.io/corvus-dotnet/corvus-regex-ecma262-dotnet:harness-1.0.5.3, commit 6157d28, ran here 12:13-12:42 UTC"],["Rust","ghcr.io/corvus-dotnet/corvus-regex-ecma262-rs:harness-0.2.1.5, commit 11664dd, ran here 12:43-12:49 UTC"],["C","ghcr.io/corvus-dotnet/corvus-regex-ecma262-c:harness-0.2.1.5, commit 11664dd, ran here 12:50-12:56 UTC"],["C++","ghcr.io/corvus-dotnet/corvus-regex-ecma262-cpp:harness-0.2.1.5, commit 3396e7d, ran here 12:57-13:08 UTC"],["Python","ghcr.io/corvus-dotnet/corvus-regex-ecma262-py:harness-0.2.1.3, commit c7773d1, ran here 13:08-13:17 UTC"],["Ruby","ghcr.io/corvus-dotnet/corvus-regex-ecma262-ruby:harness-0.2.1.3, commit 93b30a4, ran here 13:17-13:23 UTC"],["PHP","ghcr.io/corvus-dotnet/corvus-regex-ecma262-php:harness-0.2.1.3, commit 53b9938, ran here 13:23-13:27 UTC"],["Swift","ghcr.io/corvus-dotnet/corvus-regex-ecma262-swift:harness-0.2.1.3, commit 07207d0, ran here 13:28-13:45 UTC"],["Fortran","ghcr.io/corvus-dotnet/corvus-regex-ecma262-fortran:harness-0.2.1.3, commit 518adab, ran here 13:45-13:52 UTC"],["R","ghcr.io/corvus-dotnet/corvus-regex-ecma262-r:harness-0.2.1.3, commit 720d7b5, ran here 13:53-14:23 UTC"]],"links":[{"label":"How the benchmarks run","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-benchmarks"},{"label":"ECMA-262 test data","url":"https://github.com/corvus-dotnet/ecma262-regex-test-data/tree/cff0860b7ebc5eb9c801eb9f8cec9d5398688ff2"},{"label":".NET repository","url":"https://github.com/corvus-dotnet/Corvus.Regex.Ecma262"},{"label":"Rust repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-rs"},{"label":"C repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-rs"},{"label":"C++ repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-cpp"},{"label":"Python repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-py"},{"label":"Ruby repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-ruby"},{"label":"PHP repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-php"},{"label":"Swift repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-swift"},{"label":"Fortran repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-fortran"},{"label":"R repository","url":"https://github.com/corvus-dotnet/corvus-regex-ecma262-r"},{"label":"Every day's data","url":"data/runs/"}],"method":"<p><b>What this page shows.<\/b> The regular expression engines of each platform, side by side: engines that implement ECMA-262 (the regular expressions of JavaScript), the platform's other regex engines, which implement other dialects, and V8, the engine of Node.js and Chrome, as the common reference. Each engine is judged on the ECMA-262 test data, whose answers are V8's, and timed over the Industry workloads of dotnet/performance. An engine that does not implement ECMA-262 is there for its speed alone. How each engine is called is in the list of engines at the foot of the page.<\/p><p><b>A figure<\/b> is the time to count every match a global search finds over the whole text of a workload, moving on one character after an empty match as JavaScript's matchAll does, in nanoseconds per count. An ECMA-262 engine is given the workload's flags with u, and V8 the flags with g and u. An engine of another dialect is given the pattern as it is with the workload's i, m and s flags, and has no figure where the pattern does not compile.<\/p><p><b>How it is measured.<\/b> Every harness keeps to one protocol. The workloads run one after another, each in 3 rounds of every engine in turn, the order of the engines turned each round. Each turn is a process of its own, which warms the engine, times 7 passes of as many counts as fit in 0.7 s, and reports the median pass. An engine's figure for a workload is the median of its rounds, and its spread is the fastest and the slowest round; a figure whose spread is over 5% is listed in the facts. Work a program would do once per text, such as checking that bytes are UTF-8, is done before the timing starts.<\/p><p><b>Where the figures come from.<\/b> <a href=\"https://github.com/corvus-dotnet/corvus-regex-ecma262-benchmarks\">This repository<\/a>'s nightly workflow runs each source's published container image, at its newest release, one after another in one job on one runner. Each image runs its engines and V8 over the workloads, then <a href=\"https://github.com/corvus-dotnet/ecma262-regex-test-data/tree/cff0860b7ebc5eb9c801eb9f8cec9d5398688ff2\">the ECMA-262 test data<\/a> for compliance. So the figures of every engine run here were measured on one machine in one night's run. Anyone can add an engine: see <a href=\"https://github.com/corvus-dotnet/corvus-regex-ecma262-benchmarks/blob/main/docs/implementing-a-source.md\">implementing a source<\/a>.<\/p><p><b>Compliance<\/b> beside an engine's name is its result on the ECMA-262 test data: its right answers over every answer the data asks of it, counted by the data's own rule (tools/answers.py), so that an answer its runner did not ask counts against it as a wrong one does. Each test is asked over UTF-16 and over UTF-8, under each of the three grammars (u, v and the legacy one without either). Records and tests where V8 departs from ECMA-262 are left out for every engine. An engine leaves out nothing else unless it is of one of four kinds, each shown as a badge of what it leaves out: <b>no UTF-8<\/b> (or UTF-16), where the engine has no interface in that encoding; <b>no u, v<\/b> (or another grammar), where it has no such mode; <b>Unicode<\/b> and a version, where its tables are of another version than the data's, so it is judged by that version's answers; and <b>from exec<\/b>, where it has no global search, replace or split of its own and the runner writes them over its exec. Each runner limits an engine to 2 s a match (or an equivalent limit on its work), and an answer that reaches the limit is unanswered. An engine that cannot be stopped in a match runs in child processes, whose watchdog ends one at such an answer, and the next goes on from the answer after it; once three answers of a record have reached the limit, the rest of that record is unanswered. The tooltip has the counts, the runner and the calls it makes. Counts worked out at an earlier commit of the data (for an engine too slow to judge every night) are a share of what that commit asks, and say which commit. \"Not ECMA-262\" marks an engine that implements another dialect.<\/p><p><b>&gt; 30 s<\/b> in a cell: the engine did not produce a result within 30 s. Every harness stops a figure that has not finished in 30 s and does not run it again in the workload's later rounds, so such a cell has no figure, and the engine is not ranked on that workload.<\/p><p><b>&ne; count<\/b> in a cell: the engine's count of matches on that workload differs from V8's, which is a wrong answer. An ECMA-262 engine with one has no figure there, and each such workload is one more wrong answer in the compliance beside its name, so it is never 100%. An engine of another dialect keeps its figure, and the workload shows both counts. A cell marked failed says, in its tooltip, what the harness reported.<\/p><p><b>V8<\/b> appears once, from the .NET run.<\/p>","testData":{"repo":"corvus-dotnet/ecma262-regex-test-data","commit":"cff0860b7ebc5eb9c801eb9f8cec9d5398688ff2","unicode":"17.0","answers":{"utf16":15657804,"utf8":14295726,"grammars":{"unicode":{"utf16":6489607,"utf8":5871886},"legacy":{"utf16":7887959,"utf8":7156004},"unicode_sets":{"utf16":1280238,"utf8":1267836}}},"answersAt":{"cff0860b7ebc5eb9c801eb9f8cec9d5398688ff2|18.0":{"utf16":15657804,"utf8":14295726,"grammars":{"unicode":{"utf16":6489607,"utf8":5871886},"legacy":{"utf16":7887959,"utf8":7156004},"unicode_sets":{"utf16":1280238,"utf8":1267836}}}}},"date":"2026-10-24T14:23:12Z","runUrl":"https://github.com/corvus-dotnet/corvus-regex-ecma262-benchmarks/actions/runs/40092946940"},"vocab":{"impl":"engine","impls":"engines","Impls":"Engines","schema":"workload","schemas":"workloads","Schema":"Workload","Schemas":"Workloads","failed":"failed","centre":"Median","spread":"fastest to slowest round","barLegend":"median of the rounds","whiskerLegend":"whisker: the fastest and the slowest round"},"measures":{"time":{"label":"Time","long":"time per Count","parts":["time"]}},"impls":[{"id":"dotnet/.NET interpreter","name":".NET interpreter","group":".NET","version":"","compliance":"not ECMA-262","source":"dotnet"},{"id":"dotnet/.NET generated","name":".NET generated","group":".NET","version":"","compliance":"not ECMA-262","source":"dotnet"},{"id":"dotnet/Corvus interpreter","name":"Corvus interpreter (.NET)","group":".NET","version":"","compliance":{"right":29953530,"wrong":0,"refused":0,"acceptedInvalid":0,"limited":0,"judge":{"runner":"https://github.com/corvus-dotnet/Corvus.Regex.Ecma262/blob/main/Solutions/Corvus.Regex.Ecma262.DatasetRunner/Program.cs","calls":{"utf16":["Regex.IsMatch(string)","Regex.Match(string, int)","Regex.Matches(string)","Regex.Replace(string, string)","Regex.Split(string)"],"utf8":["Regex.IsMatch(ReadOnlySpan<byte>)","Regex.TryMatch(ReadOnlySpan<byte>, /* ---------- overall ---------- */
function renderBoard() {
  const host = document.getElementById("board");
  const rows = ranked();
  const versus = state.baseline !== "best";
  const W = width(host), rowH = 30, top = 26, narrow = W < 640;
  const covW = narrow ? 0 : 56, valW = narrow ? 70 : 104;
  // The label column fits the widest name with its compliance badge, then the group, right-aligned in a column of its
  // own; the group is left out when the two would take more than half the chart.
  const nameW = narrow ? 0 : Math.max(0, ...rows.map(r => {
    const info = IMPL.get(r.impl), comp = compliance(info);
    return textWidth(info.name, "lab", "font-weight: 600") + (comp ? 8 + textWidth(labelOf(comp), "lab-sub") : 0);
  }));
  const groupW = narrow ? 0 : Math.max(0, ...rows.map(r => IMPL.get(r.impl).group ? textWidth(IMPL.get(r.impl).group, "lab-sub") : 0));
  const showGroup = !narrow && groupW > 0 && nameW + 16 + groupW + 12 <= W / 2;
  const labelW = narrow ? Math.min(150, W * 0.38) : Math.max(230, Math.ceil(nameW + (showGroup ? 16 + groupW : 0) + 12));
  const finite = rows.filter(r => Number.isFinite(r.g)).map(r => r.g);
  let lo = Math.min(1, ...finite), hi = Math.max(1, ...finite);
  lo = Math.pow(2, Math.floor(Math.log2(lo))); hi = Math.pow(2, Math.ceil(Math.log2(hi)));
  if (lo === hi) hi = lo * 2;
  const x0 = labelW + (versus && lo < 1 ? valW : 8), x1 = W - covW - valW;
  const x = logScale(lo, hi, x0, x1);
  const H = top + rows.length * rowH + 8;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Geometric mean ${METRICS[state.metric].long} relative to ${baseLabel()}` });
  for (const t of thin(ratioTicks(lo, hi), x, 48)) {
    svg.append(svgEl("line", { x1: x(t), x2: x(t), y1: top - 6, y2: H - 4, stroke: t === 1 ? css("--axis") : css("--grid"), "stroke-width": t === 1 ? 1.5 : 1 }));
    svg.append(svgEl("text", { x: x(t), y: top - 12, "text-anchor": "middle", class: "tick" }, ratioTickLabel(t)));
  }
  if (covW) svg.append(svgEl("text", { x: W - 4, y: top - 12, "text-anchor": "end", class: "tick" }, V.schemas));
  rows.forEach((r, i) => {
    const y = top + i * rowH, cy = y + rowH / 2, info = IMPL.get(r.impl);
    svg.append(svgEl("rect", { x: 0, y, width: W, height: rowH, class: "row-hit", "data-tip": r.impl }));
    // The labels pass the pointer through to the row's hit area, whose tooltip has the compliance in full.
    const name = svgEl("text", { x: 0, y: cy + 4, class: "lab", "pointer-events": "none" }, info.name);
    if (r.impl === state.baseline) name.setAttribute("style", "fill: var(--accent); font-weight: 600");
    const comp = narrow ? null : compliance(info);
    if (comp) {
      const t = svgEl("tspan", { dx: 8, class: "lab-sub", style: `font-weight: 400; fill: var(${comp.cls === "comp-ok" ? "--faster" : comp.cls === "comp-wrong" ? "--slower" : "--muted"})` }, comp.short);
      name.append(t);
      if (comp.badges.length) name.append(svgEl("tspan", { class: "lab-sub", style: "font-weight: 400; fill: var(--muted)" }, ` · ${comp.badges.map(b => b.short).join(" · ")}`));
    }
    svg.append(name);
    if (showGroup && info.group) svg.append(svgEl("text", { x: labelW - 12, y: cy + 4, "text-anchor": "end", class: "lab-sub", "pointer-events": "none" }, info.group));
    if (Number.isFinite(r.g)) {
      const xa = x(Math.max(lo, Math.min(1, r.g))), xb = x(Math.max(1, r.g));
      const wbar = Math.max(2, xb - xa);
      const fill = r.impl === state.baseline ? css("--accent") : r.g < 1 ? css("--faster") : r.g > 1 ? css("--slower") : css("--axis");
      svg.append(svgEl("rect", { x: Math.abs(r.g - 1) < 1e-9 ? x(1) - 1 : xa, y: cy - 8, width: Math.abs(r.g - 1) < 1e-9 ? 2 : wbar, height: 16, rx: 3, fill, "pointer-events": "none" }));
      const left = r.g < 1;
      svg.append(svgEl("text", { x: left ? xa - 6 : xb + 6, y: cy + 4, "text-anchor": left ? "end" : "start", class: "val", "pointer-events": "none" },
        r.impl === state.baseline ? "baseline" : narrow ? sig(r.g < 1 ? 1 / r.g : r.g) + "×" : versus ? fmtRatio(r.g) : sig(r.g) + "×" + (r.best ? `, fastest on ${r.best}` : "")));

      const cov = svgEl("text", { x: W - 4, y: cy + 4, "text-anchor": "end", class: "val", "pointer-events": "none" }, `${NS - r.failed - r.missing - r.stopped - r.wrong}/${NS}`);
      if (r.failed) cov.setAttribute("style", "fill: var(--slower)");

  const m = METRICS[state.metric].long;
  // Implementations fastest on every schema they complete sit at 1×; say so, or say why even the leader is above it.
  const sweep = rows.filter(r => r.n > 0 && r.best === r.n);
  let lead;
  if (state.selected.size === 1) lead = `Only one ${V.impl} is selected, so it sits at 1×.`;
  else if (!sweep.length) lead = `No selected ${V.impl} is fastest on every ${V.schema}, so even the leader sits above 1×; the bar label says how many ${V.schemas} each one is fastest on.`;
  else lead = sweep.map(r => r.n === NS
    ? `${esc(implLabel(r.impl))} is fastest on every ${V.schema}, so it sits at 1×.`
    : `${esc(implLabel(r.impl))} is fastest on every ${V.schema} it completes (${r.n} of ${NS}), so it sits at 1×; check its failures before reading it as the leader.`).join(" ");
  document.getElementById("board-note").innerHTML = versus
    ? `Geometric mean of each implementation's <b>${esc(m)}</b> relative to <b>${esc(baseLabel())}</b>, over the ${V.schemas} both complete. Bars to the left are ${better()}, to the right ${worse()}.`
    : `Each implementation's <b>${esc(m)}</b> as a multiple of the fastest selected implementation <b>on each ${V.schema}</b>, averaged over the ${V.schemas} it completes (geometric mean). 1× would mean fastest on every ${V.schema}. ${lead}`;
  document.getElementById("board-legend").innerHTML = versus
    ? `<span><i class="sw" style="background:var(--faster)"></i>${better()} than ${esc(baseLabel())}</span><span><i class="sw" style="background:var(--slower)"></i>${worse()}</span>`
    : `<span><i class="sw" style="background:var(--slower)"></i>multiple of the fastest on each ${V.schema}</span>`;
}

function boardTip(id) {
  const s = summarise(id), info = IMPL.get(id);

/* ---------- matrix ---------- */
function schemaOrder() {

  const by = {

}

  return v.length > 1 ? Math.max(...v) / Math.min(...v) : 0;

  head += `</tr></thead>`;

  for (const s of schemaOrder()) {

      if (m.state === "wrong") { body += `<td class="wrongcount" data-tip="${key}">&ne; count</td>`; continue; }
      const r = ratio(id, s.name);
      const c = Number.isFinite(r) ? ratioColour(r) : { css: "transparent", L: 1 };
      const txt = state.cells === "value" ? fmtValue(m.median).replace(" ", " ") : fmtRatioShort(r);
      body += `<td data-tip="${key}" style="background:${c.css};color:${c.L < 0.62 ? "#fff" : "#0f1621"}">${txt}</td>`;

    `<span>middle: ${midLab}</span>` +
    `<span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--fail-a) 0 3px,var(--fail-b) 3px 6px);border:1px solid var(--line)"></i>failed</span>` +
    `<span>· not run</span><span>&gt; 30 s: did not produce a result within 30 s</span><span>&ne; count: a count of matches that differs from V8's, a wrong answer</span><span>Click a ${V.schema} for its detail.</span>`;
}
function matrixTip(key) {

/* ---------- one schema ---------- */
function renderSchema() {

  const meta = (s.meta || []).map(([k, v]) => `<span><b>${esc(v)}</b> ${esc(k)}</span>`);
  if (s.url) meta.push(`<span><a href="${esc(s.url)}">${esc(s.urlLabel || "source")}</a></span>`);

  for (const id of state.selected) {

  }
  ok.sort((a, b) => a.m.median - b.m.median);
  bad.sort((a, b) => implLabel(a.id).localeCompare(implLabel(b.id)));
  const rows = ok.concat(bad);
  const W = width(host), rowH = 28, top = 26, narrow = W < 640;
  const labelW = narrow ? Math.min(150, W * 0.38) : 230, valW = narrow ? 74 : 150;
  const x0 = labelW, x1 = W - valW;
  const H = top + Math.max(1, rows.length) * rowH + 8;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${METRICS[state.metric].long} on ${s.name}` });
  if (!ok.length) {
    svg.append(svgEl("text", { x: 0, y: top + 16, class: "val" }, `No selected ${V.impl} completes this ${V.schema}.`));
  } else {

    if (state.scale === "log" && minV > 0) {

      const lo = Math.pow(10, Math.floor(Math.log10(minV))), hi = Math.pow(10, Math.ceil(Math.log10(maxV)));
      x = logScale(lo, hi === lo ? lo * 10 : hi, x0, x1); ticks = valueTicksLog(lo, hi === lo ? lo * 10 : hi); origin = lo;
    } else {

    }
    for (const t of thin(ticks, x)) {
      svg.append(svgEl("line", { x1: x(t), x2: x(t), y1: top - 6, y2: H - 4, stroke: t === origin ? css("--axis") : css("--grid") }));
      svg.append(svgEl("text", { x: x(t), y: top - 12, "text-anchor": "middle", class: "tick" }, fmtValue(t).replace(/\.00? /, " ")));

/* ---------- head to head ---------- */

    if (mb.state !== "ok") failB++;

  }

    ? `On <b>${esc(METRICS[state.metric].long)}</b>, ${nameA} is ${better()} on <b>${winsA}</b> of the <b>${pts.length}</b> ${V.schemas} both complete, and ${nameB} on <b>${pts.length - winsA}</b>. Geometric mean: ${nameA} is <b>${g < 1 ? sig(1 / g) + "× " + better() : sig(g) + "× " + worse()}</b>.` +
      (failA || failB ? ` Left out: ${failA ? `${failA} ${failA === 1 ? V.schema : V.schemas} ${nameA} fails` : ""}${failA && failB ? ", " : ""}${failB ? `${failB} ${nameB} fails` : ""}.` : "")
    : `${nameA} and ${nameB} have no ${V.schema} in common to compare.`;

  const W = width(host), rowH = 20, top = 26, narrow = W < 640, labelW = narrow ? 120 : 190;
  const H = top + Math.max(1, pts.length) * rowH + 8;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${implLabel(A)} relative to ${implLabel(B)} per schema` });
  if (pts.length) {
    let lo = Math.min(1, ...pts.map(p => p.r)), hi = Math.max(1, ...pts.map(p => p.r));
    lo = Math.pow(2, Math.floor(Math.log2(lo))); hi = Math.pow(2, Math.ceil(Math.log2(hi)));
    if (lo === hi) { lo /= 2; hi *= 2; }
    const x = logScale(lo, hi, labelW + 8, W - 16);

      svg.append(svgEl("line", { x1: x(t), x2: x(t), y1: top - 6, y2: H - 4, stroke: t === 1 ? css("--axis") : css("--grid"), "stroke-width": t === 1 ? 1.5 : 1 }));

      svg.append(svgEl("text", { x: labelW, y: cy + 4, "text-anchor": "end", class: "lab", style: "font-size:12px", "pointer-events": "none" }, p.s));
      svg.append(svgEl("line", { x1: x(1), x2: x(p.r), y1: cy, y2: cy, stroke: col, "stroke-width": 2, "pointer-events": "none" }));
      svg.append(svgEl("circle", { cx: x(p.r), cy, r: 5, fill: col, stroke: ring, "stroke-width": 2, "pointer-events": "none" }));
    });
    svg.append(svgEl("text", { x: labelW + 8, y: H - 0, class: "tick", "text-anchor": "start" }, `← ${implLabel(A)} ${better()}`));
    svg.append(svgEl("text", { x: W - 16, y: H - 0, class: "tick", "text-anchor": "end" }, `${implLabel(B)} ${better()} →`));
    svg.setAttribute("viewBox", `0 0 ${W} ${H + 12}`);
  }
  host.replaceChildren(svg);
}
function h2hTip(schema) {
  const ma = measure(state.a, schema), mb = measure(state.b, schema), r = div(ma.median, mb.median);
  return `<div class="t-h">${esc(schema)}</div><div class="t-s">${esc(METRICS[state.metric].long)}</div>` +
    tipRows([[implLabel(state.a), fmtValue(ma.median)], [implLabel(state.b), fmtValue(mb.median)],
      ["", r < 1 ? `${implLabel(state.a)} ${sig(1 / r)}× ${better()}` : `${implLabel(state.b)} ${sig(r)}× ${better()}`]]);
}

/* ---------- controls ---------- */
function implOptions(sel, includeBest) {
  const opts = (includeBest ? [`<option value="best">Fastest on each ${esc(V.schema)}</option>`] : [])
    .concat(DATA.impls.map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`));
  sel.innerHTML = opts.join("");
}
function renderControls() {
  document.querySelectorAll("#metric button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.metric === state.metric)));
  document.querySelectorAll("#cells button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cell === state.cells)));
  document.querySelectorAll("#scale button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scale === state.scale)));
  document.getElementById("baseline").value = state.baseline;
  document.getElementById("sort").value = state.sort;
  document.getElementById("schema-pick").value = state.schema;
  document.getElementById("h2h-a").value = state.a;
  document.getElementById("h2h-b").value = state.b;
  document.getElementById("picker-sum").textContent = `${V.Impls} · ${state.selected.size} of ${ALL.length}`;
  document.querySelectorAll("#langs input").forEach(i => { i.checked = state.selected.has(i.value); });
}
function render() {
  cache.clear();
  readPalette();
  renderControls();
  renderBoard();
  renderMatrix();
  renderSchema();
  renderH2H();
  writeHash();
}

function init() {
  readHash();
  if (!state.a || !state.b) {
    const order = ranked().map(r => r.impl);
    state.a = state.a || order[0] || ALL[0];
    state.b = state.b || order.find(id => id !== state.a) || ALL[0];
  }

  const meta = DATA.meta, bits = [];
  document.title = meta.title;
  document.getElementById("title").textContent = meta.title;
  document.getElementById("lede").textContent = meta.lede || "";
  document.getElementById("method-text").innerHTML = meta.method || "";
  renderEngines();
  document.getElementById("by-schema-title").textContent = `By ${V.schema}`;
  document.getElementById("schema-title").textContent = V.Schema;
  document.getElementById("schema-pick").setAttribute("aria-label", V.Schema);
  document.getElementById("h2h-a").setAttribute("aria-label", `First ${V.impl}`);
  document.getElementById("h2h-b").setAttribute("aria-label", `Second ${V.impl}`);
  // Where the data carries compliance, the quick pick is the fully compliant implementations; otherwise those that
  // complete every workload.
  document.getElementById("pick-complete").textContent = HAS_COMPLIANCE ? "Only those 100% compliant" : `Only those that complete every ${V.schema}`;
  document.getElementById("repo").innerHTML = `<a href="https://github.com/${esc(meta.repo)}">${esc(meta.repo.replace("/", " / "))}</a>`;
  // The run's time, as the data gives it: a day alone is printed as a day, never with an invented midnight.
  if (meta.date) bits.push(`<div><span>Run</span> ${esc(/^\d{4}-\d{2}-\d{2}$/.test(meta.date) ? new Date(meta.date + "T00:00:00Z").toUTCString().replace(/ \d\d:\d\d:\d\d GMT$/, "") : new Date(meta.date).toUTCString().replace(/:\d\d GMT$/, " UTC"))}</div>`);
  if (meta.commit) bits.push(`<div><span>Commit</span> <a href="https://github.com/${esc(meta.repo)}/commit/${esc(meta.commit)}">${esc(meta.commit.slice(0, 10))}</a></div>`);
  if (meta.runUrl) bits.push(`<div><a href="${esc(meta.runUrl)}">Workflow run</a></div>`);
  // Related pages the data names (meta.links: [{label, url}]), such as the pinned record from the daily run and back.
  for (const l of meta.links || []) if (l && l.url && l.label) bits.push(`<div><a href="${esc(l.url)}">${esc(l.label)}</a></div>`);
  if (meta.runner) bits.push(`<div><span>Runner</span> ${esc(meta.runner)}</div>`);
  for (const [k, v] of (meta.facts || [])) bits.push(`<div><span>${esc(k)}</span> ${esc(v)}</div>`);
  bits.push(`<div><span>${esc(V.Impls)}</span> ${ALL.length}</div><div><span>${esc(V.Schemas)}</span> ${NS}</div>`);
  if (meta.runs) bits.push(`<div><span>Runs each</span> ${meta.runs}</div>`);
  document.getElementById("runmeta").innerHTML = bits.join("");

  const metricHost = document.getElementById("metric");
  metricHost.innerHTML = Object.entries(METRICS).map(([k, m]) => `<button type="button" data-metric="${k}">${esc(m.label)}</button>`).join("");
  metricHost.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.metric = b.dataset.metric; render(); } });
  document.getElementById("cells").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.cells = b.dataset.cell; render(); } });
  document.getElementById("scale").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.scale = b.dataset.scale; render(); } });

  implOptions(document.getElementById("baseline"), true);
  implOptions(document.getElementById("h2h-a"), false);
  implOptions(document.getElementById("h2h-b"), false);
  document.getElementById("schema-pick").innerHTML = DATA.schemas.map(s => `<option>${esc(s.name)}</option>`).join("");
  document.getElementById("baseline").addEventListener("change", e => { state.baseline = e.target.value; if (state.baseline !== "best") state.selected.add(state.baseline); render(); });
  document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
  document.getElementById("schema-pick").addEventListener("change", e => { state.schema = e.target.value; render(); });
  document.getElementById("h2h-a").addEventListener("change", e => { state.a = e.target.value; render(); });
  document.getElementById("h2h-b").addEventListener("change", e => { state.b = e.target.value; render(); });

  const byLang = new Map();
  for (const i of DATA.impls) { const k = i.group || "Other"; if (!byLang.has(k)) byLang.set(k, []); byLang.get(k).push(i); }
  document.getElementById("langs").innerHTML = [...byLang.keys()].sort((a, b) => a.localeCompare(b)).map(lang =>
    `<div class="lang"><h3>${esc(lang)}</h3>` + byLang.get(lang).map(i =>
      `<label title="${esc(i.version || "")}"><input type="checkbox" id="pick-${esc(i.id)}" value="${esc(i.id)}">` +
      `<span><span class="pick-name">${i.name.split(" ").map(w => `<span class="w">${esc(w)}</span>`).join(" ")}</span>` +
      `<span class="pick-meta">${i.version ? `<small>${esc(i.version.split(" ")[0])}</small>` : ""}` +
      `${compliance(i) ? `<span class="comp ${compliance(i).cls}" title="${esc(compliance(i).long)}">${esc(compliance(i).short)}</span>` +
        compliance(i).badges.map(b => `<span class="comp comp-x" title="${esc(b.long)}">${esc(b.short)}</span>`).join("") : ""}</span></span></label>`).join("") + `</div>`).join("");
  document.getElementById("langs").addEventListener("change", e => {
    const id = e.target.value;
    if (e.target.checked) state.selected.add(id); else state.selected.delete(id);
    if (!state.selected.has(state.baseline) && state.baseline !== "best") state.baseline = "best";
    render();
  });
  document.querySelector(".picker-actions").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pick === "all") state.selected = new Set(ALL);
    if (b.dataset.pick === "none") state.selected = new Set(state.baseline === "best" ? [] : [state.baseline]);
    if (b.dataset.pick === "complete") state.selected = new Set(ALL.filter(id => HAS_COMPLIANCE ? fullyCompliant(IMPL.get(id)) : DATA.schemas.every(s => measure(id, s.name).state === "ok")));
    if (state.baseline !== "best" && !state.selected.has(state.baseline)) state.baseline = "best";
    render();
  });
  const picker = document.getElementById("picker");
  document.addEventListener("click", e => { if (picker.open && !picker.contains(e.target)) picker.open = false; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") picker.open = false; });

  document.getElementById("matrix").addEventListener("click", e => {
    const th = e.target.closest("th[data-schema]");
    if (!th) return;
    state.schema = th.dataset.schema; render();
    document.getElementById("schema").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });
  wireTips(document.getElementById("board"), boardTip);
  wireTips(document.getElementById("matrix"), matrixTip);
  wireTips(document.getElementById("schema-chart"), schemaTip);
  wireTips(document.getElementById("h2h-chart"), h2hTip);

  let pending = 0, lastW = 0;
  new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (w === lastW) return;
    lastW = w;
    cancelAnimationFrame(pending); pending = requestAnimationFrame(render);
  }).observe(document.querySelector("main .wrap"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  render();
  // The Overall chart's label column is measured in the page's fonts: draw again once they have loaded.
  if (document.fonts) document.fonts.ready.then(render);
}
init();
</script>
</body>
</html>
